<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AK Learning Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html,body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7ff;color:#1e293b;max-width:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .hidden{display:none!important}
  .top-grad{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#9333ea 100%)}
  .c-blue{background:linear-gradient(135deg,#2563eb,#4f46e5)}
  .c-green{background:linear-gradient(135deg,#059669,#10b981)}
  .c-rose{background:linear-gradient(135deg,#e11d48,#f97316)}
  .c-teal{background:linear-gradient(135deg,#0d9488,#06b6d4)}
  .c-purple{background:linear-gradient(135deg,#7c3aed,#c026d3)}
  .c-amber{background:linear-gradient(135deg,#d97706,#f59e0b)}
  .card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(79,70,229,.06)}
  .mbg{background:rgba(15,23,42,.55);backdrop-filter:blur(3px)}
  .tab-on{color:#6d28d9;border-bottom:3px solid #6d28d9;font-weight:700}
</style>
</head>
<body class="pb-20 md:pb-8">

<div id="loader" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-white/85">
  <div class="w-9 h-9 border-4 border-violet-200 border-t-violet-600 rounded-full animate-spin"></div>
  <p class="mt-2 text-xs font-bold text-violet-700">Syncing...</p>
</div>

<div id="toast" class="fixed top-3 left-3 right-3 sm:left-auto sm:right-4 z-50 hidden">
  <div class="flex items-center gap-2 px-4 py-2.5 rounded-xl shadow-lg bg-slate-900 text-white text-xs font-medium">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i><span id="toast-msg">Done</span>
  </div>
</div>

<header class="top-grad text-white sticky top-0 z-30 shadow-md">
  <div class="max-w-5xl mx-auto px-3.5 py-3 flex items-center justify-between gap-2">
    <div onclick="navTo('dashboard')" class="flex items-center gap-2.5 cursor-pointer min-w-0">
      <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center shrink-0"><i class="fa-solid fa-graduation-cap text-amber-300"></i></div>
      <div class="min-w-0"><h1 class="text-sm sm:text-base font-extrabold truncate">AK Learning Hub</h1><p class="text-[10px] text-violet-100">Tuition Management</p></div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button type="button" onclick="openStudentModal(null)" class="bg-white text-violet-700 px-2.5 py-1.5 rounded-xl text-xs font-extrabold shadow-sm">+ Student</button>
      <button type="button" onclick="openFeeModal('')" class="bg-emerald-400 text-emerald-950 px-2.5 py-1.5 rounded-xl text-xs font-extrabold shadow-sm">₹ Fee</button>
      <button type="button" onclick="openConnectModal()" class="bg-white/20 p-2 rounded-xl text-xs" title="Sheet Link"><i class="fa-solid fa-gear"></i></button>
    </div>
  </div>
  <div class="hidden md:block bg-white text-slate-600 border-b">
    <div class="max-w-5xl mx-auto px-4 flex gap-6 text-sm font-semibold">
      <button type="button" onclick="navTo('dashboard')" id="dtab-dashboard" class="py-2.5 tab-on">Dashboard</button>
      <button type="button" onclick="navTo('fees')" id="dtab-fees" class="py-2.5">Fees</button>
      <button type="button" onclick="navTo('attendance')" id="dtab-attendance" class="py-2.5">Attendance</button>
      <button type="button" onclick="navTo('batches')" id="dtab-batches" class="py-2.5">Batches</button>
      <button type="button" onclick="navTo('tests')" id="dtab-tests" class="py-2.5">Tests</button>
      <button type="button" onclick="navTo('reports')" id="dtab-reports" class="py-2.5">Reports</button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-3 py-4 space-y-4">
  <section id="sec-dashboard" class="space-y-4"></section>
  <section id="sec-fees" class="hidden space-y-3.5"></section>
  <section id="sec-attendance" class="hidden space-y-3.5"></section>
  <section id="sec-batches" class="hidden space-y-3.5"></section>
  <section id="sec-tests" class="hidden space-y-3.5"></section>
  <section id="sec-reports" class="hidden space-y-3.5"></section>
</main>

<nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t grid grid-cols-6 py-1.5 px-1 z-30 shadow-[0_-4px_12px_rgba(79,70,229,0.08)]">
  <button type="button" onclick="navTo('dashboard')" id="mtab-dashboard" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-bold text-violet-700 bg-violet-50"><i class="fa-solid fa-house text-xs mb-0.5"></i><span>Home</span></button>
  <button type="button" onclick="navTo('fees')" id="mtab-fees" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400"><i class="fa-solid fa-indian-rupee-sign text-xs mb-0.5"></i><span>Fees</span></button>
  <button type="button" onclick="navTo('attendance')" id="mtab-attendance" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400"><i class="fa-solid fa-calendar-check text-xs mb-0.5"></i><span>Attend</span></button>
  <button type="button" onclick="navTo('batches')" id="mtab-batches" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400"><i class="fa-solid fa-layer-group text-xs mb-0.5"></i><span>Batches</span></button>
  <button type="button" onclick="navTo('tests')" id="mtab-tests" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400"><i class="fa-solid fa-file-pen text-xs mb-0.5"></i><span>Tests</span></button>
  <button type="button" onclick="navTo('reports')" id="mtab-reports" class="flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400"><i class="fa-solid fa-chart-simple text-xs mb-0.5"></i><span>Reports</span></button>
</nav>

<!-- CONNECT MODAL -->
<div id="modal-connect" class="fixed inset-0 z-50 hidden mbg flex items-start pt-12 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
    <div class="px-4 py-3 top-grad text-white flex justify-between items-center"><h3 class="font-bold text-sm">Connect Google Sheet</h3><button type="button" onclick="closeM('modal-connect')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-4 space-y-3 text-xs">
      <p class="text-slate-500">Paste your Google Apps Script Web App URL (<b>/exec</b>):</p>
      <input type="url" id="inp-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border rounded-xl px-3 py-2">
      <button type="button" onclick="saveUrlConnect()" class="w-full top-grad text-white font-bold py-2.5 rounded-xl">Connect & Save</button>
    </div>
  </div>
</div>

<!-- STUDENT MODAL -->
<div id="modal-student" class="fixed inset-0 z-50 hidden mbg flex items-start pt-6 justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[88vh] overflow-y-auto">
    <div class="px-4 py-3 top-grad text-white flex justify-between items-center sticky top-0"><h3 id="stu-m-title" class="font-bold text-sm">Add Student</h3><button type="button" onclick="closeM('modal-student')"><i class="fa-solid fa-xmark"></i></button></div>
    <form onsubmit="saveStudentForm(event)" class="p-4 space-y-2.5 text-xs">
      <input type="hidden" id="f-stu-admno">
      <div><label class="font-semibold text-slate-500">Student Name *</label><input type="text" id="f-stu-name" required class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Class *</label><input type="text" id="f-stu-class" required placeholder="10th" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
        <div><label class="font-semibold text-slate-500">Monthly Fee (₹) *</label><input type="number" id="f-stu-fee" required min="0" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm font-bold"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Father Name</label><input type="text" id="f-stu-father" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
        <div><label class="font-semibold text-slate-500">Parent Phone *</label><input type="tel" id="f-stu-pphone" required class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
      </div>
      <div><label class="font-semibold text-slate-500">Assign Batches</label><div id="f-stu-batches" class="flex flex-wrap gap-1.5 mt-1 p-2 bg-violet-50/60 rounded-xl border border-violet-100"></div></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Joining Date *</label><input type="date" id="f-stu-jdate" required class="w-full border rounded-xl px-2 py-2 mt-1"></div>
        <div><label class="font-semibold text-slate-500">Status</label><select id="f-stu-status" class="w-full border rounded-xl px-2 py-2 mt-1 bg-white font-semibold"><option>Active</option><option>Left</option></select></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Leaving Date</label><input type="date" id="f-stu-ldate" class="w-full border rounded-xl px-2 py-2 mt-1"></div>
        <div><label class="font-semibold text-slate-500">Address</label><input type="text" id="f-stu-addr" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
      </div>
      <div class="flex gap-2 pt-1">
        <button type="submit" class="flex-1 top-grad text-white font-bold py-2.5 rounded-xl">Save</button>
        <button type="button" id="f-stu-del" class="hidden px-4 bg-rose-50 text-rose-600 font-bold py-2.5 rounded-xl">Delete</button>
      </div>
    </form>
  </div>
</div>

<!-- BATCH MODAL -->
<div id="modal-batch" class="fixed inset-0 z-50 hidden mbg flex items-start pt-10 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
    <div class="px-4 py-3 c-teal text-white flex justify-between items-center"><h3 id="bat-m-title" class="font-bold text-sm">Create Batch</h3><button type="button" onclick="closeM('modal-batch')"><i class="fa-solid fa-xmark"></i></button></div>
    <form onsubmit="saveBatchForm(event)" class="p-4 space-y-3 text-xs">
      <input type="hidden" id="f-bat-id"><input type="hidden" id="f-bat-old">
      <div><label class="font-semibold text-slate-500">Batch Name *</label><input type="text" id="f-bat-name" required placeholder="e.g., Batch 1" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Class</label><input type="text" id="f-bat-class" placeholder="10th" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
        <div><label class="font-semibold text-slate-500">Timing</label><input type="text" id="f-bat-time" placeholder="4 PM - 5 PM" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm"></div>
      </div>
      <button type="submit" class="w-full c-teal text-white font-bold py-2.5 rounded-xl">Save Batch</button>
    </form>
  </div>
</div>

<!-- BATCH STUDENTS MODAL -->
<div id="modal-batch-stus" class="fixed inset-0 z-50 hidden mbg flex items-start pt-6 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
    <div class="px-4 py-3 c-blue text-white flex justify-between items-center"><h3 id="mbs-title" class="font-bold text-sm">Batch Students</h3><button type="button" onclick="closeM('modal-batch-stus')"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="mbs-body" class="p-4 overflow-y-auto space-y-3 text-xs"></div>
  </div>
</div>

<!-- FEE MODAL -->
<div id="modal-fee" class="fixed inset-0 z-50 hidden mbg flex items-start pt-10 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
    <div class="px-4 py-3 c-green text-white flex justify-between items-center"><h3 class="font-bold text-sm">Collect Fee</h3><button type="button" onclick="closeM('modal-fee')"><i class="fa-solid fa-xmark"></i></button></div>
    <form onsubmit="saveFeeForm(event)" class="p-4 space-y-3 text-xs">
      <div><label class="font-semibold text-slate-500">Student *</label><select id="f-fee-admno" required onchange="updateFeeHint()" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm bg-white"></select></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Month *</label><input type="month" id="f-fee-month" required onchange="updateFeeHint()" class="w-full border rounded-xl px-2 py-2 mt-1"></div>
        <div><label class="font-semibold text-slate-500">Date *</label><input type="date" id="f-fee-date" required class="w-full border rounded-xl px-2 py-2 mt-1"></div>
      </div>
      <div id="f-fee-hint" class="bg-emerald-50 border border-emerald-200 p-2 rounded-xl font-semibold text-emerald-900"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="font-semibold text-slate-500">Amount (₹) *</label><input type="number" id="f-fee-amount" required min="1" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm font-bold"></div>
        <div><label class="font-semibold text-slate-500">Mode</label><select id="f-fee-mode" class="w-full border rounded-xl px-3 py-2 mt-1 text-sm bg-white"><option>Cash</option><option>UPI</option></select></div>
      </div>
      <button type="submit" class="w-full c-green text-white font-bold py-2.5 rounded-xl">Save Fee</button>
    </form>
  </div>
</div>

<!-- TEST MODAL -->
<div id="modal-test" class="fixed inset-0 z-50 hidden mbg flex items-start pt-6 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[88vh] flex flex-col overflow-hidden">
    <div class="px-4 py-3 c-purple text-white flex justify-between items-center"><h3 class="font-bold text-sm">Add Test & Marks</h3><button type="button" onclick="closeM('modal-test')"><i class="fa-solid fa-xmark"></i></button></div>
    <form onsubmit="saveTestForm(event)" class="p-4 space-y-2.5 text-xs overflow-y-auto">
      <div class="grid grid-cols-2 gap-2"><input type="text" id="f-test-name" required placeholder="Test Name *" class="border rounded-xl px-3 py-2 text-sm"><input type="text" id="f-test-sub" required placeholder="Subject *" class="border rounded-xl px-3 py-2 text-sm"></div>
      <div class="grid grid-cols-2 gap-2"><select id="f-test-batch" onchange="renderTestMarksInp()" class="border rounded-xl px-2 py-2 bg-white font-bold"></select><input type="date" id="f-test-date" required class="border rounded-xl px-2 py-2"></div>
      <div class="grid grid-cols-2 gap-2"><input type="number" id="f-test-max" required value="100" min="1" placeholder="Max Marks" class="border rounded-xl px-3 py-2 font-bold"><input type="number" id="f-test-pass" required value="35" min="0" placeholder="Pass Marks" class="border rounded-xl px-3 py-2 font-bold"></div>
      <div id="f-test-marks" class="border rounded-xl divide-y max-h-48 overflow-y-auto p-1"></div>
      <button type="submit" class="w-full c-purple text-white font-bold py-2.5 rounded-xl">Save Test</button>
    </form>
  </div>
</div>

<!-- TEST DETAIL MODAL -->
<div id="modal-test-det" class="fixed inset-0 z-50 hidden mbg flex items-start pt-6 justify-center p-3">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
    <div class="px-4 py-3 c-purple text-white flex justify-between items-center"><div><h3 id="td-title" class="font-bold text-sm">Test Marks</h3><p id="td-meta" class="text-[11px] text-purple-100"></p></div><button type="button" onclick="closeM('modal-test-det')"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="td-body" class="p-4 overflow-y-auto space-y-2"></div>
    <div class="p-3 bg-slate-50 border-t text-right"><button type="button" id="td-del" class="text-xs font-bold text-rose-600">Delete Test</button></div>
  </div>
</div>

<script>
let gasUrl=localStorage.getItem('AK_LH_GAS_URL')||'';
let authToken=localStorage.getItem('AK_LH_TOKEN')||'';
let DB={students:[],batches:[],fees:[],attendance:[],tests:[],testMarks:[],todayStr:''};
let curSec='dashboard',feeB='ALL',feeSub='unpaid',attB='ALL',attSub='mark',attDate='',attLoc={},testB='ALL';
const $=i=>document.getElementById(i),fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function today(){if(DB.todayStr)return DB.todayStr;const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function curYM(){return today().slice(0,7);}
function openM(i){window.scrollTo(0,0);$(i).classList.remove('hidden');}
function closeM(i){$(i).classList.add('hidden');}
function load(s){$('loader').classList.toggle('hidden',!s);$('loader').classList.toggle('flex',s);}
function toast(m,err=false){$('toast-msg').innerText=m;$('toast-icon').className=err?'fa-solid fa-circle-exclamation text-rose-400':'fa-solid fa-circle-check text-emerald-400';$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000);}

async function api(action,extra={}){
  if(!gasUrl){openConnectModal();throw new Error('Connect Google Sheet first');}
  let res=await fetch(gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:authToken,...extra})});
  let j=await res.json();
  if(j.authError){
    const lr=await fetch(gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:'admin',password:'ak1234'})});
    const lj=await lr.json();
    if(lj.ok){authToken=lj.token;localStorage.setItem('AK_LH_TOKEN',authToken);res=await fetch(gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:authToken,...extra})});j=await res.json();}
    else{openConnectModal();throw new Error(lj.error||'Auth failed');}
  }
  if(!j.ok)throw new Error(j.error||'Failed');
  return j.data;
}

function openConnectModal(){$('inp-url').value=gasUrl;openM('modal-connect');}
async function saveUrlConnect(){
  const u=$('inp-url').value.trim();if(!u.startsWith('https://script.google.com/'))return toast('Invalid /exec URL',true);
  gasUrl=u;localStorage.setItem('AK_LH_GAS_URL',u);closeM('modal-connect');initLoad();
}

async function initLoad(){
  if(!gasUrl)return openConnectModal();
  load(true);
  try{DB=await api('getAllData');attDate=today();syncAtt();render();}
  catch(e){toast(e.message,true);}finally{load(false);}
}
document.addEventListener('DOMContentLoaded',initLoad);

const mColors={
  dashboard:'text-violet-700 bg-violet-50',
  fees:'text-emerald-700 bg-emerald-50',
  attendance:'text-teal-700 bg-teal-50',
  batches:'text-blue-700 bg-blue-50',
  tests:'text-purple-700 bg-purple-50',
  reports:'text-rose-700 bg-rose-50'
};

function navTo(sec){
  curSec=sec;
  ['dashboard','fees','attendance','batches','tests','reports'].forEach(t=>{
    $('sec-'+t).classList.toggle('hidden',t!==sec);
    const dt=$('dtab-'+t),mt=$('mtab-'+t);
    if(dt)dt.className=t===sec?'py-2.5 tab-on':'py-2.5';
    if(mt)mt.className=t===sec?`flex flex-col items-center py-1 rounded-xl text-[9px] font-bold ${mColors[t]}`:'flex flex-col items-center py-1 rounded-xl text-[9px] font-semibold text-slate-400';
  });
  render();window.scrollTo(0,0);
}

function monthSpan(s,e){
  if(!s||!e||s>e)return[];const r=[];let[y,m]=s.split('-').map(Number),[ey,em]=e.split('-').map(Number),g=0;
  while((y<ey||(y===ey&&m<=em))&&g<120){r.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++;}g++;}
  return r;
}

function feeStats(){
  const cm=curYM();let tExp=0,tRec=0,tPend=0,pCnt=0,uCnt=0;
  const stus=DB.students.map(s=>{
    const st=s.joiningDate?s.joiningDate.slice(0,7):cm;
